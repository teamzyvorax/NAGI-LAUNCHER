name: NAGI Amethyst Engine Build

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/amethyst-engine-reference.yml"
      - "ENGINE_INTEGRATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nagi-engine:
    name: Build NAGI Android engine APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Amethyst engine source
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: 9423d6054115767b56de7ed0b83ed18fc1eba3c2
          submodules: recursive
          path: amethyst

      - name: Set up JDK 8 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up JDK 17 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-36"
          "$SDKMANAGER" --install "platforms;android-36.1"
          "$SDKMANAGER" --install "ndk;27.3.13750724"

      - name: Apply NAGI branding and CI SDK compatibility
        working-directory: amethyst
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("app_pojavlauncher/build.gradle")
          source = gradle.read_text()
          if "compileSdk = 37" not in source:
              raise SystemExit("Expected upstream compileSdk 37 declaration was not found")
          source = source.replace(
              "compileSdk = 37",
              """compileSdk {
                  version = release(36) {
                      minorApiLevel = 1
                  }
              }""",
              1
          )
          source = source.replace('resValue "string", "app_name", "Amethyst (Debug)"',
                                  'resValue "string", "app_name", "NAGI Launcher"')
          source = source.replace('resValue "string", "app_short_name", "Amethyst (Debug)"',
                                  'resValue "string", "app_short_name", "NAGI"')
          gradle.write_text(source)
          settings = Path("settings.gradle")
          settings_source = settings.read_text()
          settings_source = settings_source.replace(
              "pluginManagement {",
              """pluginManagement {
              resolutionStrategy {
                  eachPlugin {
                      if (requested.id.id == 'com.android.application' || requested.id.id == 'com.android.library') {
                          useModule("com.android.tools.build:gradle:${requested.version}")
                      }
                  }
              }"""
          )
          settings.write_text(settings_source)
          PY

      - name: Build NAGI engine APK
        working-directory: amethyst
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app_pojavlauncher:assembleDebug

      - name: Upload NAGI engine APK
        uses: actions/upload-artifact@v4
        with:
          name: NAGI-AMETHYST-ENGINE-APK
          path: amethyst/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
