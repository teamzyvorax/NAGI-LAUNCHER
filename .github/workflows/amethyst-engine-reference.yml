name: Amethyst Engine Reference Build

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/amethyst-engine-reference.yml"
      - "ENGINE_INTEGRATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-amethyst-reference:
    name: Build Amethyst Android reference APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Amethyst source with submodules
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: v3_openjdk
          submodules: recursive
          path: amethyst

      - name: Set up JDK 8 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up JDK 17 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-36"
          "$SDKMANAGER" --install "platforms;android-36.1"
          "$SDKMANAGER" --install "ndk;27.3.13750724"

      - name: Use available stable Android compile SDK
        working-directory: amethyst
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app_pojavlauncher/build.gradle")
          source = path.read_text()
          if "compileSdk = 37" not in source:
              raise SystemExit("Expected Amethyst compileSdk 37 declaration was not found")
          replacement = """compileSdk {
                  version = release(36) {
                      minorApiLevel = 1
                  }
              }"""
          path.write_text(source.replace("compileSdk = 37", replacement, 1))
          PY

      - name: Configure direct Android Gradle Plugin resolution
        working-directory: amethyst
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("settings.gradle")
          source = path.read_text()
          source = source.replace(
              "pluginManagement {",
              """pluginManagement {
              resolutionStrategy {
                  eachPlugin {
                      if (requested.id.id == 'com.android.application' || requested.id.id == 'com.android.library') {
                          useModule("com.android.tools.build:gradle:${requested.version}")
                      }
                  }
              }"""
          )
          path.write_text(source)
          PY

      - name: Verify Java installations
        run: |
          java -version
          "${JAVA_HOME_8_X64}/bin/java" -version
          test -x "${JAVA_HOME_8_X64}/bin/java"

      - name: Build Amethyst reference APK
        working-directory: amethyst
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app_pojavlauncher:assembleDebug

      - name: Upload Amethyst reference APK
        uses: actions/upload-artifact@v4
        with:
          name: AMETHYST-ENGINE-REFERENCE-APK-not-integrated-into-NAGI
          path: amethyst/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
